<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="wmCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0088ff" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <style>
    .wm-charu { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 42px; letter-spacing: 2px; fill: #ffffff; fill-opacity: 0.85; }
    .wm-autos { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 42px; letter-spacing: 5px; fill: url(#wmCyan); }
    .wm-sub { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 6px; fill: #94a3b8; fill-opacity: 0.8; }
  </style>

  <!-- Mini Isotipo Vectorial -->
  <g transform="translate(10, 15) scale(0.24)">
    <polygon points="250,20 440,110 440,360 250,475 60,360 60,110" fill="#0b1329" fill-opacity="0.7" stroke="#00f2fe" stroke-width="6" stroke-opacity="0.8"/>
    <path d="M 230,125 L 160,125 Q 110,125 110,175 L 110,325 Q 110,375 160,375 L 230,375 L 210,335 L 165,335 Q 145,335 145,315 L 145,185 Q 145,165 165,165 L 210,165 Z" fill="#ffffff" fill-opacity="0.9"/>
    <polygon points="270,125 310,125 380,375 340,375 320,295 270,295 285,240 305,240 295,195" fill="#00f2fe"/>
    <path d="M 298,125 L 340,125 L 410,375 L 368,375 L 348,300 L 300,300 L 306,260 L 338,260 L 315,175 Z" fill="#ffffff" fill-opacity="0.9"/>
    <polygon points="200,270 325,270 315,290 190,290" fill="#ff2a5f"/>
  </g>

  <!-- Tipografía -->
  <text x="140" y="66" class="wm-charu">CHARU<tspan class="wm-autos">AUTOS</tspan></text>
  <text x="142" y="92" class="wm-sub">@CHARUAUTOPICS</text>
</svg>
