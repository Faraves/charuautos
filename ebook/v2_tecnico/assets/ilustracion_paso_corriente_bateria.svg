<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="520" rx="16" fill="url(#bgBat)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="30" y="20" width="900" height="54" rx="8" fill="#131e33" stroke="rgba(0,242,254,0.3)"/>
  <text x="50" y="44" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">MÓDULO 07 • BATERÍA Y CORRIENTE</text>
  <text x="50" y="63" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="17" font-weight="900">PROTOCOLO DE 4 PASOS: CÓMO PASAR CORRIENTE SIN QUEMAR LA ECU</text>
  <text x="890" y="52" text-anchor="end" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">⚠️ ORDEN VITAL 1-2-3-4</text>

  <!-- Left: Auto Donante (Batería Sana) -->
  <g transform="translate(60, 100)">
    <rect width="360" height="260" rx="12" fill="#111c30" stroke="#10b981" stroke-width="1.5"/>
    <rect x="20" y="16" width="320" height="32" rx="6" fill="#162744"/>
    <text x="180" y="37" text-anchor="middle" fill="#10b981" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800">🚗 AUTO DONANTE (BATERÍA SANA)</text>
    
    <!-- Battery Graphic -->
    <rect x="50" y="70" width="260" height="150" rx="8" fill="#0a101d" stroke="#334155" stroke-width="2"/>
    <rect x="90" y="58" width="36" height="12" rx="2" fill="#ef4444"/>
    <rect x="234" y="58" width="36" height="12" rx="2" fill="#38bdf8"/>
    <text x="108" y="105" text-anchor="middle" fill="#ef4444" font-family="'Montserrat', sans-serif" font-size="28" font-weight="900">+</text>
    <text x="252" y="105" text-anchor="middle" fill="#38bdf8" font-family="'Montserrat', sans-serif" font-size="34" font-weight="900">-</text>
    <text x="180" y="150" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">12.6V • Batería Cargada</text>
    <text x="180" y="185" text-anchor="middle" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Motor encendido en ralentí</text>
  </g>

  <!-- Right: Auto Varado (Batería Agotada) -->
  <g transform="translate(540, 100)">
    <rect width="360" height="260" rx="12" fill="#111c30" stroke="#ff2a5f" stroke-width="1.5"/>
    <rect x="20" y="16" width="320" height="32" rx="6" fill="#162744"/>
    <text x="180" y="37" text-anchor="middle" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800">🛑 AUTO VARADO (BATERÍA MUERTA)</text>
    
    <!-- Battery Graphic -->
    <rect x="50" y="70" width="260" height="150" rx="8" fill="#0a101d" stroke="#334155" stroke-width="2"/>
    <rect x="90" y="58" width="36" height="12" rx="2" fill="#ef4444"/>
    <rect x="234" y="58" width="36" height="12" rx="2" fill="#475569"/>
    <text x="108" y="105" text-anchor="middle" fill="#ef4444" font-family="'Montserrat', sans-serif" font-size="28" font-weight="900">+</text>
    <text x="252" y="105" text-anchor="middle" fill="#64748b" font-family="'Montserrat', sans-serif" font-size="34" font-weight="900">-</text>
    <text x="180" y="150" text-anchor="middle" fill="#ff2a5f" font-family="'Inter', sans-serif" font-size="12">&lt; 10.5V • Sin Carga</text>
    
    <!-- Grounding chassis bolt icon -->
    <circle cx="310" cy="225" r="16" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
    <text x="310" y="230" text-anchor="middle" fill="#000" font-family="'Montserrat', sans-serif" font-size="10" font-weight="900">MASA</text>
  </g>

  <!-- Connecting Cable Lines (Animated Style) -->
  <!-- Cable 1 & 2: RED POSITIVE -->
  <path d="M 168 158 C 168 40, 648 40, 648 158" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <!-- Step 1 Badge -->
  <circle cx="648" cy="90" r="14" fill="#ef4444"/>
  <text x="648" y="95" text-anchor="middle" fill="#fff" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900">1</text>
  <!-- Step 2 Badge -->
  <circle cx="168" cy="90" r="14" fill="#ef4444"/>
  <text x="168" y="95" text-anchor="middle" fill="#fff" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900">2</text>

  <!-- Cable 3 & 4: BLACK NEGATIVE -->
  <path d="M 312 158 C 312 370, 850 370, 850 325" fill="none" stroke="#38bdf8" stroke-width="5" stroke-dasharray="8,4" stroke-linecap="round"/>
  <!-- Step 3 Badge -->
  <circle cx="312" cy="300" r="14" fill="#38bdf8"/>
  <text x="312" y="305" text-anchor="middle" fill="#000" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900">3</text>
  <!-- Step 4 Badge -->
  <circle cx="850" cy="360" r="14" fill="#f59e0b"/>
  <text x="850" y="365" text-anchor="middle" fill="#000" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900">4</text>

  <!-- Warning Box: NEVER TO NEGATIVE TERMINAL -->
  <rect x="680" y="160" width="140" height="46" rx="6" fill="rgba(255,42,95,0.2)" stroke="#ff2a5f"/>
  <text x="750" y="178" text-anchor="middle" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="10" font-weight="900">❌ ¡NO CONECTAR</text>
  <text x="750" y="194" text-anchor="middle" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="10" font-weight="900">AL BORNE (-) AQUÍ!</text>

  <!-- Step Sequence Instructions Bottom -->
  <g transform="translate(60, 390)">
    <rect width="840" height="95" rx="10" fill="#111a2d" stroke="#233452"/>
    <text x="25" y="28" fill="#ef4444" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900">PASO 1:</text>
    <text x="80" y="28" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">Pinza ROJA al borne (+) del auto varado.</text>
    
    <text x="440" y="28" fill="#ef4444" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900">PASO 2:</text>
    <text x="495" y="28" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">Pinza ROJA al borne (+) del auto donante.</text>

    <text x="25" y="58" fill="#38bdf8" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900">PASO 3:</text>
    <text x="80" y="58" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">Pinza NEGRA al borne (-) del auto donante.</text>

    <text x="440" y="58" fill="#f59e0b" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900">PASO 4:</text>
    <text x="495" y="58" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">Pinza NEGRA a metal sin pintar (masa) del auto varado.</text>

    <rect x="20" y="70" width="800" height="18" rx="3" fill="#090f1a"/>
    <text x="420" y="83" text-anchor="middle" fill="#ffb703" font-family="'Inter', sans-serif" font-size="10" font-weight="700">
      ⚡ Desconexión: Exactamente en orden inverso (4 ➔ 3 ➔ 2 ➔ 1). El auto rescatado debe rodar 20 min continuos.
    </text>
  </g>
</svg>