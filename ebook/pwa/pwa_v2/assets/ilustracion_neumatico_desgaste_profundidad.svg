<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#10192a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="450" rx="16" fill="url(#bgTire)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="30" y="20" width="900" height="54" rx="8" fill="#131e33" stroke="rgba(0,242,254,0.3)"/>
  <text x="50" y="44" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">MÓDULO 06 • NEUMÁTICOS Y SEGURIDAD</text>
  <text x="50" y="63" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="17" font-weight="900">EVALUACIÓN VISUAL: PROFUNDIDAD DE SURCO Y PELIGRO DE AQUAPLANING</text>
  <text x="890" y="52" text-anchor="end" fill="#ffb703" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700">🪙 TESTIGO TWI</text>

  <!-- Left: Healthy Tire Profile -->
  <g transform="translate(60, 100)">
    <rect width="380" height="240" rx="12" fill="#111c30" stroke="#10b981" stroke-width="2"/>
    <text x="190" y="32" text-anchor="middle" fill="#10b981" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900">✅ NEUMÁTICO SEGURO (&gt; 3.0 mm)</text>
    
    <!-- Tread blocks profile -->
    <path d="M 40 160 L 40 80 L 90 80 L 90 160 L 130 160 L 130 80 L 180 80 L 180 160 L 220 160 L 220 80 L 270 80 L 270 160 L 310 160 L 310 80 L 340 80 L 340 160 Z" fill="#1f293d" stroke="#334155" stroke-width="2"/>
    
    <!-- Water evacuation arrows -->
    <path d="M 110 130 L 110 160" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 200 130 L 200 160" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 290 130 L 290 160" stroke="#38bdf8" stroke-width="3"/>

    <!-- Dimension Bracket -->
    <line x1="95" y1="80" x2="95" y2="160" stroke="#10b981" stroke-width="2"/>
    <text x="105" y="125" fill="#10b981" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">7-8 mm (Nuevo)</text>

    <text x="190" y="195" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">• Evacua hasta 30 litros de agua por seg.</text>
    <text x="190" y="215" text-anchor="middle" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Frenada en mojado a 80 km/h: 35 metros</text>
  </g>

  <!-- Right: Bald / Danger Tire Profile -->
  <g transform="translate(520, 100)">
    <rect width="380" height="240" rx="12" fill="#111c30" stroke="#ff2a5f" stroke-width="2"/>
    <text x="190" y="32" text-anchor="middle" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900">🛑 NEUMÁTICO PELIGROSO (&lt; 1.6 mm)</text>
    
    <!-- Bald tread blocks profile -->
    <path d="M 40 160 L 40 145 L 90 145 L 90 160 L 130 160 L 130 145 L 180 145 L 180 160 L 220 160 L 220 145 L 270 145 L 270 160 L 310 160 L 310 145 L 340 145 L 340 160 Z" fill="#1f293d" stroke="#ff2a5f" stroke-width="2"/>
    
    <!-- Water Blocked icon -->
    <text x="190" y="130" text-anchor="middle" fill="#ff2a5f" font-size="18">⚠️</text>

    <!-- Dimension Bracket -->
    <line x1="95" y1="145" x2="95" y2="160" stroke="#ff2a5f" stroke-width="2"/>
    <text x="105" y="156" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800">1.6 mm</text>

    <text x="190" y="195" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">• No desaloja agua: FLOTA sobre el asfalto.</text>
    <text x="190" y="215" text-anchor="middle" fill="#ff2a5f" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Frenada en mojado a 80 km/h: 65 metros (+85%)</text>
  </g>

  <!-- How to Check Trick at Bottom -->
  <g transform="translate(60, 360)">
    <rect width="840" height="65" rx="10" fill="#0e172a" stroke="#253754"/>
    <text x="25" y="28" fill="#ffb703" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">💡 EL TRUCO DE LA MONEDA O TESTIGO TWI:</text>
    <text x="25" y="48" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">
      Busca las letras <strong style="fill:#00f2fe;">"TWI"</strong> o un pequeño triángulo en el borde exterior. Indica los tacos internos de 1.6 mm. Si la superficie de la banda llega a tocar ese taco, el neumático es ilegal y peligroso.
    </text>
  </g>
</svg>