<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg360" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#0f1929"/>
    </linearGradient>
  </defs>
  <rect width="960" height="480" rx="16" fill="url(#bg360)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="30" y="20" width="900" height="54" rx="8" fill="#121d30" stroke="rgba(0,242,254,0.3)"/>
  <text x="50" y="44" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">MÓDULO 04 • RUTINA PREVENTIVA</text>
  <text x="50" y="63" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="17" font-weight="900">INSPECCIÓN PERIMÉTRICA DE 360° (EN 10 SEGUNDOS)</text>
  <text x="890" y="52" text-anchor="end" fill="#ffb703" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700">⏱️ ANTES DE SUBIR AL AUTO</text>

  <!-- Central Car Silhouette Outline -->
  <g transform="translate(360, 100)">
    <!-- Car body top view outline -->
    <path d="M 60 40 C 90 20, 150 20, 180 40 C 200 60, 210 100, 210 160 L 210 240 C 210 300, 200 320, 180 330 C 150 340, 90 340, 60 330 C 40 320, 30 300, 30 240 L 30 160 C 30 100, 40 60, 60 40 Z" fill="#132038" stroke="#00f2fe" stroke-width="2.5"/>
    <!-- Windshields -->
    <path d="M 65 90 L 175 90 L 165 140 L 75 140 Z" fill="#1e3357" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 75 230 L 165 230 L 175 270 L 65 270 Z" fill="#1e3357" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Roof -->
    <rect x="75" y="145" width="90" height="80" rx="6" fill="#0e1a2f"/>
    <!-- Wheels -->
    <rect x="14" y="65" width="14" height="42" rx="4" fill="#ffb703"/>
    <rect x="212" y="65" width="14" height="42" rx="4" fill="#ffb703"/>
    <rect x="14" y="245" width="14" height="42" rx="4" fill="#ffb703"/>
    <rect x="212" y="245" width="14" height="42" rx="4" fill="#ffb703"/>
    <text x="120" y="190" text-anchor="middle" fill="#64748b" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">FRENTE ▲</text>

    <!-- Walking arrow trail -->
    <ellipse cx="120" cy="185" rx="160" ry="175" fill="none" stroke="rgba(0,242,254,0.35)" stroke-width="2" stroke-dasharray="6,6"/>
  </g>

  <!-- Step 1 (Top Left): Suelo -->
  <g transform="translate(30, 95)">
    <rect width="280" height="82" rx="10" fill="#111c30" stroke="#ff2a5f" stroke-width="1.5"/>
    <circle cx="36" cy="41" r="18" fill="#ff2a5f"/>
    <text x="36" y="47" text-anchor="middle" fill="#fff" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900">1</text>
    <text x="64" y="32" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800">SUELO BAJO EL MOTOR</text>
    <text x="64" y="50" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">¿Hay charcos de aceite o refrigerante?</text>
    <text x="64" y="68" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" font-weight="700">✓ Agua inodora = Condensación A/C normal</text>
  </g>

  <!-- Step 2 (Bottom Left): Neumáticos -->
  <g transform="translate(30, 275)">
    <rect width="280" height="82" rx="10" fill="#111c30" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="36" cy="41" r="18" fill="#f59e0b"/>
    <text x="36" y="47" text-anchor="middle" fill="#000" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900">2</text>
    <text x="64" y="32" fill="#f59e0b" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800">LAS 4 LLANTAS</text>
    <text x="64" y="50" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">¿Alguna rueda se ve "panzona" o baja?</text>
    <text x="64" y="68" fill="#ffb703" font-family="'Inter', sans-serif" font-size="10" font-weight="700">⚠️ Rodar sin aire destruye la llanta en 500m</text>
  </g>

  <!-- Step 3 (Top Right): Cristales y Espejos -->
  <g transform="translate(650, 95)">
    <rect width="280" height="82" rx="10" fill="#111c30" stroke="#00f2fe" stroke-width="1.5"/>
    <circle cx="36" cy="41" r="18" fill="#00f2fe"/>
    <text x="36" y="47" text-anchor="middle" fill="#000" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900">3</text>
    <text x="64" y="32" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800">VIDRIOS Y ESPEJOS</text>
    <text x="64" y="50" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Sin hojas, nieve, suciedad o hielo.</text>
    <text x="64" y="68" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">✓ Comprobar retrovisores desplegados</text>
  </g>

  <!-- Step 4 (Bottom Right): Luces y Obstáculos -->
  <g transform="translate(650, 275)">
    <rect width="280" height="82" rx="10" fill="#111c30" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="36" cy="41" r="18" fill="#10b981"/>
    <text x="36" y="47" text-anchor="middle" fill="#fff" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900">4</text>
    <text x="64" y="32" fill="#10b981" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800">ENTORNO Y OBSTÁCULOS</text>
    <text x="64" y="50" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">¿Mascotas, juguetes o pilotes detrás?</text>
    <text x="64" y="68" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" font-weight="700">✓ Ópticas y matrícula limpias y visibles</text>
  </g>

  <!-- Footer Tip -->
  <rect x="180" y="415" width="600" height="42" rx="8" fill="#0a1220" stroke="#1e293b"/>
  <text x="480" y="441" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">
    💡 <strong style="fill:#00f2fe;">Hábito del Conductor Inteligente:</strong> Haz esta vuelta mientras caminas con las llaves en mano. Solo toma 10 segundos.
  </text>
</svg>