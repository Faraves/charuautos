<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFuse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d16"/>
      <stop offset="100%" stop-color="#121b2d"/>
    </linearGradient>
    <linearGradient id="fuseBodyOk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.4)"/>
      <stop offset="100%" stop-color="rgba(0, 136, 255, 0.25)"/>
    </linearGradient>
    <linearGradient id="fuseBodyBad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 42, 95, 0.4)"/>
      <stop offset="100%" stop-color="rgba(180, 0, 40, 0.25)"/>
    </linearGradient>
  </defs>
  <rect width="960" height="440" rx="16" fill="url(#bgFuse)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="30" y="20" width="900" height="54" rx="8" fill="#131e33" stroke="rgba(0,242,254,0.3)"/>
  <text x="50" y="44" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">MÓDULO 07 • SISTEMA ELÉCTRICO</text>
  <text x="50" y="63" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="17" font-weight="900">DIAGNÓSTICO VISUAL: FUSIBLE EN BUEN ESTADO VS. FUSIBLE FUNDIDO</text>
  <text x="890" y="52" text-anchor="end" fill="#10b981" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700">🔍 REVISIÓN CON LUZ TRASERA</text>

  <!-- Left: Good Fuse -->
  <g transform="translate(100, 100)">
    <rect width="340" height="240" rx="12" fill="#111c30" stroke="#10b981" stroke-width="2"/>
    <text x="170" y="32" text-anchor="middle" fill="#10b981" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900">✅ FUSIBLE BUENO (INTACTO)</text>
    
    <!-- Fuse Graphic Body -->
    <rect x="100" y="55" width="140" height="90" rx="10" fill="url(#fuseBodyOk)" stroke="#00f2fe" stroke-width="2"/>
    <!-- Blade Terminals -->
    <rect x="115" y="145" width="30" height="55" rx="3" fill="#cbd5e1"/>
    <rect x="195" y="145" width="30" height="55" rx="3" fill="#cbd5e1"/>
    <!-- Top Amperage Text -->
    <text x="170" y="80" text-anchor="middle" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900">15A</text>
    <!-- Continuous U-Filament -->
    <path d="M 130 115 C 130 95, 170 95, 170 115 C 170 95, 210 95, 210 115" fill="none" stroke="#38ef7d" stroke-width="4" stroke-linecap="round"/>
    <text x="170" y="222" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">Filamento en "U" o "S" continuo</text>
  </g>

  <!-- Right: Bad Fuse -->
  <g transform="translate(520, 100)">
    <rect width="340" height="240" rx="12" fill="#111c30" stroke="#ff2a5f" stroke-width="2"/>
    <text x="170" y="32" text-anchor="middle" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900">❌ FUSIBLE FUNDIDO / QUEMADO</text>
    
    <!-- Fuse Graphic Body -->
    <rect x="100" y="55" width="140" height="90" rx="10" fill="url(#fuseBodyBad)" stroke="#ff2a5f" stroke-width="2"/>
    <!-- Blade Terminals -->
    <rect x="115" y="145" width="30" height="55" rx="3" fill="#cbd5e1"/>
    <rect x="195" y="145" width="30" height="55" rx="3" fill="#cbd5e1"/>
    <!-- Top Amperage Text -->
    <text x="170" y="80" text-anchor="middle" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900">15A</text>
    <!-- Broken Filament with Burn Marks -->
    <path d="M 130 115 C 130 100, 145 100, 148 108" fill="none" stroke="#ff2a5f" stroke-width="4" stroke-linecap="round"/>
    <path d="M 192 108 C 195 100, 210 100, 210 115" fill="none" stroke="#ff2a5f" stroke-width="4" stroke-linecap="round"/>
    <!-- Burn cloud spark -->
    <circle cx="170" cy="106" r="14" fill="#000000" opacity="0.75"/>
    <text x="170" y="111" text-anchor="middle" fill="#f59e0b" font-size="13">💥</text>
    <text x="170" y="222" text-anchor="middle" fill="#ff2a5f" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Filamento partido o cápsula ahumada</text>
  </g>

  <!-- Color Codes Guide at Bottom -->
  <g transform="translate(60, 360)">
    <rect width="840" height="60" rx="8" fill="#0d1424" stroke="#1e293b"/>
    <text x="25" y="25" fill="#94a3b8" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800">CÓDIGO DE COLORES ESTÁNDAR DIN:</text>
    
    <rect x="25" y="32" width="12" height="12" rx="2" fill="#ea580c"/>
    <text x="42" y="43" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">5A Naranja</text>

    <rect x="140" y="32" width="12" height="12" rx="2" fill="#dc2626"/>
    <text x="157" y="43" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">10A Rojo</text>

    <rect x="245" y="32" width="12" height="12" rx="2" fill="#2563eb"/>
    <text x="262" y="43" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">15A Azul</text>

    <rect x="345" y="32" width="12" height="12" rx="2" fill="#ca8a04"/>
    <text x="362" y="43" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">20A Amarillo</text>

    <rect x="470" y="32" width="12" height="12" rx="2" fill="#e2e8f0"/>
    <text x="487" y="43" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">25A Blanco</text>

    <rect x="580" y="32" width="12" height="12" rx="2" fill="#16a34a"/>
    <text x="597" y="43" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">30A Verde</text>

    <text x="825" y="38" text-anchor="end" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="10" font-weight="700">¡Sustituir SIEMPRE por idéntico amperaje!</text>
  </g>
</svg>