<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="960" height="540" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Header Banner -->
  <rect x="30" y="24" width="900" height="60" rx="10" fill="#131d31" stroke="rgba(0,242,254,0.3)"/>
  <text x="50" y="52" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" letter-spacing="2">CHARUAUTOS • GUÍA VISUAL PARA PRINCIPIANTES</text>
  <text x="50" y="72" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900">ANALOGÍA VITAL: EL VEHÍCULO VS. EL CUERPO HUMANO</text>
  <text x="890" y="60" text-anchor="end" fill="#ffb703" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">🐾 CERO JERGA</text>

  <!-- 6 Grid Cards -->
  <!-- Card 1: Motor / Corazón -->
  <g transform="translate(30, 104)">
    <rect width="286" height="195" rx="12" fill="#111a2e" stroke="#2a3b5c" stroke-width="1.5"/>
    <rect x="16" y="16" width="38" height="38" rx="8" fill="rgba(255,42,95,0.15)" stroke="#ff2a5f"/>
    <text x="35" y="42" text-anchor="middle" font-size="20">❤️</text>
    <text x="66" y="34" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800">EL MOTOR</text>
    <text x="66" y="49" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Equivalente: EL CORAZÓN</text>
    <line x1="16" y1="66" x2="270" y2="66" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="88" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">• Transforma combustible en movimiento.</text>
    <text x="16" y="108" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">• Trabaja a miles de pulsaciones por min.</text>
    <rect x="16" y="130" width="254" height="48" rx="6" fill="#17233d"/>
    <text x="24" y="148" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="10" font-weight="700">REGLA DE ORO:</text>
    <text x="24" y="165" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Sin lubricación se funde en menos de 2 min.</text>
  </g>

  <!-- Card 2: Aceite / Sangre -->
  <g transform="translate(337, 104)">
    <rect width="286" height="195" rx="12" fill="#111a2e" stroke="#2a3b5c" stroke-width="1.5"/>
    <rect x="16" y="16" width="38" height="38" rx="8" fill="rgba(245,158,11,0.15)" stroke="#f59e0b"/>
    <text x="35" y="42" text-anchor="middle" font-size="20">🛢️</text>
    <text x="66" y="34" fill="#f59e0b" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800">ACEITE DE MOTOR</text>
    <text x="66" y="49" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Equivalente: LA SANGRE</text>
    <line x1="16" y1="66" x2="270" y2="66" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="88" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">• Evita fricción metal contra metal.</text>
    <text x="16" y="108" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">• Enfría, limpia y sella los cilindros.</text>
    <rect x="16" y="130" width="254" height="48" rx="6" fill="#17233d"/>
    <text x="24" y="148" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="10" font-weight="700">REGLA DE ORO:</text>
    <text x="24" y="165" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Revisar varilla cada 1.000 km o 15 días.</text>
  </g>

  <!-- Card 3: Refrigerante / Sudor -->
  <g transform="translate(644, 104)">
    <rect width="286" height="195" rx="12" fill="#111a2e" stroke="#2a3b5c" stroke-width="1.5"/>
    <rect x="16" y="16" width="38" height="38" rx="8" fill="rgba(0,242,254,0.15)" stroke="#00f2fe"/>
    <text x="35" y="42" text-anchor="middle" font-size="20">❄️</text>
    <text x="66" y="34" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800">REFRIGERANTE</text>
    <text x="66" y="49" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Equivalente: EL SUDOR / TERMOSTATO</text>
    <line x1="16" y1="66" x2="270" y2="66" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="88" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">• Mantiene el motor a 90 °C constantes.</text>
    <text x="16" y="108" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">• Evita que el agua hierva o se congele.</text>
    <rect x="16" y="130" width="254" height="48" rx="6" fill="#17233d"/>
    <text x="24" y="148" fill="#ff2a5f" font-family="'Inter', sans-serif" font-size="10" font-weight="700">¡PELIGRO GRAVE!</text>
    <text x="24" y="165" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">JAMÁS abrir tapón con motor caliente.</text>
  </g>

  <!-- Card 4: Sistema Eléctrico / Nervioso -->
  <g transform="translate(30, 317)">
    <rect width="286" height="195" rx="12" fill="#111a2e" stroke="#2a3b5c" stroke-width="1.5"/>
    <rect x="16" y="16" width="38" height="38" rx="8" fill="rgba(16,185,129,0.15)" stroke="#10b981"/>
    <text x="35" y="42" text-anchor="middle" font-size="20">⚡</text>
    <text x="66" y="34" fill="#10b981" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800">SISTEMA ELÉCTRICO</text>
    <text x="66" y="49" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Equivalente: EL SISTEMA NERVIOSO</text>
    <line x1="16" y1="66" x2="270" y2="66" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="88" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">• Batería = Energía de arranque.</text>
    <text x="16" y="108" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">• Alternador = Generador en marcha.</text>
    <rect x="16" y="130" width="254" height="48" rx="6" fill="#17233d"/>
    <text x="24" y="148" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" font-weight="700">DATO CLAVE:</text>
    <text x="24" y="165" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">La vida útil de la batería es de 3 a 4 años.</text>
  </g>

  <!-- Card 5: Frenos / Músculos de Detención -->
  <g transform="translate(337, 317)">
    <rect width="286" height="195" rx="12" fill="#111a2e" stroke="#2a3b5c" stroke-width="1.5"/>
    <rect x="16" y="16" width="38" height="38" rx="8" fill="rgba(239,68,68,0.15)" stroke="#ef4444"/>
    <text x="35" y="42" text-anchor="middle" font-size="20">🛑</text>
    <text x="66" y="34" fill="#ef4444" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800">SISTEMA DE FRENOS</text>
    <text x="66" y="49" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Equivalente: MÚSCULOS DE FRENO</text>
    <line x1="16" y1="66" x2="270" y2="66" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="88" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">• Pastillas aprietan discos para frenar.</text>
    <text x="16" y="108" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">• Fluido hidráulico transmite la fuerza.</text>
    <rect x="16" y="130" width="254" height="48" rx="6" fill="#17233d"/>
    <text x="24" y="148" fill="#ef4444" font-family="'Inter', sans-serif" font-size="10" font-weight="700">LÍMITE DE SEGURIDAD:</text>
    <text x="24" y="165" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Grosor mínimo de pastilla: 3 milímetros.</text>
  </g>

  <!-- Card 6: Neumáticos / Calzado -->
  <g transform="translate(644, 317)">
    <rect width="286" height="195" rx="12" fill="#111a2e" stroke="#2a3b5c" stroke-width="1.5"/>
    <rect x="16" y="16" width="38" height="38" rx="8" fill="rgba(0,242,254,0.15)" stroke="#00f2fe"/>
    <text x="35" y="42" text-anchor="middle" font-size="20">🛞</text>
    <text x="66" y="34" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800">NEUMÁTICOS</text>
    <text x="66" y="49" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Equivalente: EL CALZADO Y PIERNAS</text>
    <line x1="16" y1="66" x2="270" y2="66" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="88" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">• Único contacto entre el auto y el piso.</text>
    <text x="16" y="108" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">• 4 parches del tamaño de una mano.</text>
    <rect x="16" y="130" width="254" height="48" rx="6" fill="#17233d"/>
    <text x="24" y="148" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="10" font-weight="700">MÍNIMO LEGAL:</text>
    <text x="24" y="165" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Profundidad mínima de surco: 1.6 mm.</text>
  </g>
</svg>