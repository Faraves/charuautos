<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTireChange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#111a2d"/>
    </linearGradient>
  </defs>
  <rect width="960" height="520" rx="16" fill="url(#bgTireChange)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="30" y="20" width="900" height="54" rx="8" fill="#131e33" stroke="rgba(0,242,254,0.3)"/>
  <text x="50" y="44" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">MÓDULO 12 • EMERGENCIAS EN RUTA</text>
  <text x="50" y="63" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="17" font-weight="900">PROTOCOLO DE 6 PASOS: CÓMO CAMBIAR UNA LLANTA PONCHADA CON SEGURIDAD</text>
  <text x="890" y="52" text-anchor="end" fill="#ffb703" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700">🛡️ SEGURIDAD VIAL</text>

  <!-- Steps 1 to 6 Grid (2 rows x 3 cols) -->
  <!-- Step 1 -->
  <g transform="translate(60, 95)">
    <rect width="260" height="175" rx="10" fill="#111c30" stroke="#2a3b5c" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#00f2fe"/>
    <text x="30" y="35" text-anchor="middle" fill="#000" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900">1</text>
    <text x="54" y="33" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">INMOVILIZAR AUTO</text>
    <line x1="16" y1="52" x2="244" y2="52" stroke="#1e293b"/>
    <text x="16" y="74" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Terreno plano y seguro.</text>
    <text x="16" y="94" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Freno de mano al máximo.</text>
    <text x="16" y="114" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• 1ª marcha o posición 'P'.</text>
    <rect x="16" y="130" width="228" height="32" rx="4" fill="#17233d"/>
    <text x="24" y="150" fill="#ffb703" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Intermitentes y chaleco puestos.</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(350, 95)">
    <rect width="260" height="175" rx="10" fill="#111c30" stroke="#2a3b5c" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#00f2fe"/>
    <text x="30" y="35" text-anchor="middle" fill="#000" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900">2</text>
    <text x="54" y="33" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">AFLOJAR EN EL SUELO</text>
    <line x1="16" y1="52" x2="244" y2="52" stroke="#1e293b"/>
    <text x="16" y="74" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Con la rueda aún en el piso.</text>
    <text x="16" y="94" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Gira pernos 1/2 vuelta (antihorario).</text>
    <text x="16" y="114" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• ¡Nunca con el auto en el aire!</text>
    <rect x="16" y="130" width="228" height="32" rx="4" fill="#17233d"/>
    <text x="24" y="150" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Usa el peso corporal en la llave.</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(640, 95)">
    <rect width="260" height="175" rx="10" fill="#111c30" stroke="#2a3b5c" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#00f2fe"/>
    <text x="30" y="35" text-anchor="middle" fill="#000" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900">3</text>
    <text x="54" y="33" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">PUNTO DEL GATO</text>
    <line x1="16" y1="52" x2="244" y2="52" stroke="#1e293b"/>
    <text x="16" y="74" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Busca la muesca de acero.</text>
    <text x="16" y="94" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Tras la rueda delantera o trasera.</text>
    <text x="16" y="114" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Jamás sobre chapa o plástico.</text>
    <rect x="16" y="130" width="228" height="32" rx="4" fill="rgba(255,42,95,0.2)"/>
    <text x="24" y="150" fill="#ff2a5f" font-family="'Inter', sans-serif" font-size="10" font-weight="800">¡NUNCA meter el cuerpo debajo!</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(60, 290)">
    <rect width="260" height="175" rx="10" fill="#111c30" stroke="#2a3b5c" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#00f2fe"/>
    <text x="30" y="35" text-anchor="middle" fill="#000" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900">4</text>
    <text x="54" y="33" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">ELEVAR A 3 CM</text>
    <line x1="16" y1="52" x2="244" y2="52" stroke="#1e293b"/>
    <text x="16" y="74" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Sube hasta despegar la rueda.</text>
    <text x="16" y="94" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Desatornilla los pernos a mano.</text>
    <text x="16" y="114" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Retira la llanta desinflada.</text>
    <rect x="16" y="130" width="228" height="32" rx="4" fill="#17233d"/>
    <text x="24" y="150" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Pon la llanta bajo el zócalo por segur.</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(350, 290)">
    <rect width="260" height="175" rx="10" fill="#111c30" stroke="#2a3b5c" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#00f2fe"/>
    <text x="30" y="35" text-anchor="middle" fill="#000" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900">5</text>
    <text x="54" y="33" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">MONTAR REPUESTO</text>
    <line x1="16" y1="52" x2="244" y2="52" stroke="#1e293b"/>
    <text x="16" y="74" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Encaja la rueda en los espárragos.</text>
    <text x="16" y="94" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Aprieta los pernos a mano firme.</text>
    <text x="16" y="114" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Comprueba que asiente plana.</text>
    <rect x="16" y="130" width="228" height="32" rx="4" fill="#17233d"/>
    <text x="24" y="150" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Solo ajuste inicial con dedos.</text>
  </g>

  <!-- Step 6 -->
  <g transform="translate(640, 290)">
    <rect width="260" height="175" rx="10" fill="#111c30" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#10b981"/>
    <text x="30" y="35" text-anchor="middle" fill="#fff" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900">6</text>
    <text x="54" y="33" fill="#10b981" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">BAJAR Y APRIETE CRUZ</text>
    <line x1="16" y1="52" x2="244" y2="52" stroke="#1e293b"/>
    <text x="16" y="74" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Baja el gato y retíralo.</text>
    <text x="16" y="94" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Apriete en cruz / diagonal.</text>
    <text x="16" y="114" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• Rueda 'galleta': Máximo a 80 km/h.</text>
    <rect x="16" y="130" width="228" height="32" rx="4" fill="rgba(16,185,129,0.2)"/>
    <text x="24" y="150" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" font-weight="800">¡Reparar llanta original pronto!</text>
  </g>

  <!-- Footnote -->
  <text x="480" y="492" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">
    ⭐ <strong>Patrón en Cruz:</strong> Aprieta perno superior ➔ Perno inferior opuesto ➔ Perno lateral izquierdo ➔ Perno lateral derecho.
  </text>
</svg>