<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOBD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#121a2c"/>
    </linearGradient>
  </defs>
  <rect width="960" height="440" rx="16" fill="url(#bgOBD)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="30" y="20" width="900" height="54" rx="8" fill="#131e33" stroke="rgba(0,242,254,0.3)"/>
  <text x="50" y="44" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">MÓDULO 10 • DIAGNÓSTICO ELECTRÓNICO</text>
  <text x="50" y="63" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="17" font-weight="900">ANATOMÍA DEL PUERTO OBD-II DE 16 PINES (ON-BOARD DIAGNOSTICS)</text>
  <text x="890" y="52" text-anchor="end" fill="#ffb703" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700">🔌 ESTÁNDAR GLOBAL</text>

  <!-- Left: Illustrated Trapezoidal OBD2 Socket -->
  <g transform="translate(60, 100)">
    <rect width="400" height="230" rx="12" fill="#101828" stroke="#253553" stroke-width="1.5"/>
    <text x="200" y="30" text-anchor="middle" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">PUERTO HEMBRA (EN TU AUTO)</text>

    <!-- Trapezoid Outline -->
    <path d="M 60 70 L 340 70 L 310 170 L 90 170 Z" fill="#090f1b" stroke="#00f2fe" stroke-width="2.5"/>

    <!-- Pins 1 to 8 (Top Row) -->
    <g transform="translate(75, 90)">
      <rect x="0" y="0" width="20" height="16" rx="2" fill="#334155"/><text x="10" y="12" text-anchor="middle" fill="#94a3b8" font-size="9">1</text>
      <rect x="32" y="0" width="20" height="16" rx="2" fill="#334155"/><text x="42" y="12" text-anchor="middle" fill="#94a3b8" font-size="9">2</text>
      <rect x="64" y="0" width="20" height="16" rx="2" fill="#334155"/><text x="74" y="12" text-anchor="middle" fill="#94a3b8" font-size="9">3</text>
      <!-- Pin 4 Ground -->
      <rect x="96" y="0" width="20" height="16" rx="2" fill="#10b981"/><text x="106" y="12" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">4</text>
      <!-- Pin 5 Ground -->
      <rect x="128" y="0" width="20" height="16" rx="2" fill="#10b981"/><text x="138" y="12" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">5</text>
      <!-- Pin 6 CAN High -->
      <rect x="160" y="0" width="20" height="16" rx="2" fill="#00f2fe"/><text x="170" y="12" text-anchor="middle" fill="#000" font-size="9" font-weight="bold">6</text>
      <rect x="192" y="0" width="20" height="16" rx="2" fill="#334155"/><text x="202" y="12" text-anchor="middle" fill="#94a3b8" font-size="9">7</text>
      <rect x="224" y="0" width="20" height="16" rx="2" fill="#334155"/><text x="234" y="12" text-anchor="middle" fill="#94a3b8" font-size="9">8</text>
    </g>

    <!-- Pins 9 to 16 (Bottom Row) -->
    <g transform="translate(85, 130)">
      <rect x="0" y="0" width="20" height="16" rx="2" fill="#334155"/><text x="10" y="12" text-anchor="middle" fill="#94a3b8" font-size="9">9</text>
      <rect x="32" y="0" width="20" height="16" rx="2" fill="#334155"/><text x="42" y="12" text-anchor="middle" fill="#94a3b8" font-size="9">10</text>
      <rect x="64" y="0" width="20" height="16" rx="2" fill="#334155"/><text x="74" y="12" text-anchor="middle" fill="#94a3b8" font-size="9">11</text>
      <rect x="96" y="0" width="20" height="16" rx="2" fill="#334155"/><text x="106" y="12" text-anchor="middle" fill="#94a3b8" font-size="9">12</text>
      <rect x="128" y="0" width="20" height="16" rx="2" fill="#334155"/><text x="138" y="12" text-anchor="middle" fill="#94a3b8" font-size="9">13</text>
      <!-- Pin 14 CAN Low -->
      <rect x="160" y="0" width="20" height="16" rx="2" fill="#00f2fe"/><text x="170" y="12" text-anchor="middle" fill="#000" font-size="9" font-weight="bold">14</text>
      <rect x="192" y="0" width="20" height="16" rx="2" fill="#334155"/><text x="202" y="12" text-anchor="middle" fill="#94a3b8" font-size="9">15</text>
      <!-- Pin 16 Batería +12V -->
      <rect x="224" y="0" width="20" height="16" rx="2" fill="#ff2a5f"/><text x="234" y="12" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">16</text>
    </g>

    <text x="200" y="205" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Forma trapezoidal asimétrica: imposible conectar al revés.</text>
  </g>

  <!-- Right: Key Pins & Scanner Types -->
  <g transform="translate(500, 100)">
    <rect width="400" height="230" rx="12" fill="#111a2d" stroke="#253553" stroke-width="1.5"/>
    <text x="200" y="30" text-anchor="middle" fill="#ffb703" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">PINES CLAVE &amp; ESCÁNER RECOMENDADO</text>

    <!-- Pin 4 & 5 -->
    <text x="20" y="60" fill="#10b981" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">PIN 4 y 5:</text>
    <text x="95" y="60" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Tierra de Chasis y Tierra de Señal.</text>

    <!-- Pin 6 & 14 -->
    <text x="20" y="85" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">PIN 6 y 14:</text>
    <text x="95" y="85" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">CAN Bus (High &amp; Low) • Comunicación con la ECU.</text>

    <!-- Pin 16 -->
    <text x="20" y="110" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">PIN 16:</text>
    <text x="95" y="110" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Alimentación Batería +12V permanente (enciende el escáner).</text>

    <line x1="20" y1="125" x2="380" y2="125" stroke="#1e293b"/>

    <!-- Recom Escaner Bluetooth -->
    <rect x="20" y="138" width="360" height="74" rx="8" fill="#162238"/>
    <text x="35" y="160" fill="#ffb703" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">📱 ESCÁNER BLUETOOTH / WIFI ($12 - $20 USD):</text>
    <text x="35" y="180" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">• Se conecta a este puerto bajo el volante.</text>
    <text x="35" y="198" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="11">Apps gratuitas recomendadas: Car Scanner ELM OBD2 o Torque.</text>
  </g>

  <!-- Location Hint Bottom -->
  <g transform="translate(60, 350)">
    <rect width="840" height="65" rx="10" fill="#0e172a" stroke="#253754"/>
    <text x="25" y="28" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">📍 ¿DÓNDE ESTÁ ESTE CONECTOR EN TU AUTO?</text>
    <text x="25" y="48" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">
      En el 95% de los autos está situado <strong style="fill:#ffffff;">bajo la columna de dirección</strong> (justo sobre tus rodillas) o junto a la caja de fusibles interior del habitáculo. Es accesible sin herramientas.
    </text>
  </g>
</svg>