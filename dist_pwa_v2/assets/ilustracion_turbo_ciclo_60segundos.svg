<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTurbo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
  </defs>
  <rect width="960" height="480" rx="16" fill="url(#bgTurbo)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="30" y="20" width="900" height="54" rx="8" fill="#131e33" stroke="rgba(0,242,254,0.3)"/>
  <text x="50" y="44" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">MÓDULO 09 • CUIDADO Y MANTENIMIENTO DEL TURBO</text>
  <text x="50" y="63" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="17" font-weight="900">CÓMO FUNCIONA EL TURBOCOMPRESOR Y LA REGLA DE LOS 60 SEGUNDOS</text>
  <text x="890" y="52" text-anchor="end" fill="#ffb703" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700">🌪️ 200.000 RPM</text>

  <!-- Turbo Schematic Flow Left Box -->
  <g transform="translate(60, 95)">
    <rect width="400" height="235" rx="12" fill="#111a2d" stroke="#253553" stroke-width="1.5"/>
    <text x="200" y="28" text-anchor="middle" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">CIRCUITO TÉCNICO EN 3 PASOS</text>

    <!-- Turbine hot side -->
    <circle cx="95" cy="110" r="48" fill="#2a1215" stroke="#ff2a5f" stroke-width="2.5"/>
    <text x="95" y="105" text-anchor="middle" fill="#ff2a5f" font-size="22">🔥</text>
    <text x="95" y="125" text-anchor="middle" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="10" font-weight="800">TURBINA</text>
    <text x="95" y="137" text-anchor="middle" fill="#94a3b8" font-size="9">Gases 950°C</text>

    <!-- Floating Shaft in middle -->
    <rect x="143" y="104" width="114" height="12" rx="3" fill="#f59e0b"/>
    <text x="200" y="98" text-anchor="middle" fill="#f59e0b" font-family="'Montserrat', sans-serif" font-size="9" font-weight="800">EJE FLOTANTE</text>
    <text x="200" y="130" text-anchor="middle" fill="#cbd5e1" font-size="9">Película de aceite</text>

    <!-- Compressor cold side -->
    <circle cx="305" cy="110" r="48" fill="#0c2333" stroke="#00f2fe" stroke-width="2.5"/>
    <text x="305" y="105" text-anchor="middle" fill="#00f2fe" font-size="22">❄️</text>
    <text x="305" y="125" text-anchor="middle" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="10" font-weight="800">COMPRESOR</text>
    <text x="305" y="137" text-anchor="middle" fill="#94a3b8" font-size="9">Aire fresco</text>

    <text x="200" y="185" text-anchor="middle" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">Los gases de escape hacen girar la turbina.</text>
    <text x="200" y="202" text-anchor="middle" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">El eje mueve el compresor que mete más aire al motor.</text>
    <text x="200" y="219" text-anchor="middle" fill="#ffb703" font-family="'Inter', sans-serif" font-size="10" font-weight="700">¡Gira hasta 3.500 vueltas por segundo!</text>
  </g>

  <!-- Golden 60-Second Rule Right Box -->
  <g transform="translate(500, 95)">
    <rect width="400" height="235" rx="12" fill="#111a2d" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="200" y="28" text-anchor="middle" fill="#f59e0b" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900">⏱️ LA REGLA DE ORO DE LOS 60 SEGUNDOS</text>

    <!-- Phase 1: Arranque -->
    <g transform="translate(20, 45)">
      <circle cx="20" cy="20" r="16" fill="rgba(0,242,254,0.15)" stroke="#00f2fe"/>
      <text x="20" y="25" text-anchor="middle" fill="#00f2fe" font-weight="900">1</text>
      <text x="48" y="16" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800">AL ARRANCAR EN FRÍO:</text>
      <text x="48" y="32" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Espera 30 a 45 seg antes de acelerar. El aceite debe subir.</text>
    </g>

    <!-- Phase 2: Marcha -->
    <g transform="translate(20, 100)">
      <circle cx="20" cy="20" r="16" fill="rgba(16,185,129,0.15)" stroke="#10b981"/>
      <text x="20" y="25" text-anchor="middle" fill="#10b981" font-weight="900">2</text>
      <text x="48" y="16" fill="#10b981" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800">DURANTE EL VIAJE:</text>
      <text x="48" y="32" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Conduce suave hasta que la temperatura alcance 90 °C.</text>
    </g>

    <!-- Phase 3: Apagado -->
    <g transform="translate(20, 155)">
      <circle cx="20" cy="20" r="16" fill="rgba(255,42,95,0.15)" stroke="#ff2a5f"/>
      <text x="20" y="25" text-anchor="middle" fill="#ff2a5f" font-weight="900">3</text>
      <text x="48" y="16" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800">AL DETENERTE TRAS AUTOPISTA:</text>
      <text x="48" y="32" fill="#ffb703" font-family="'Inter', sans-serif" font-size="11" font-weight="700">¡ESPERA 60 SEGUNDOS AL RALENTÍ ANTES DE APAGAR!</text>
    </g>

    <rect x="20" y="200" width="360" height="22" rx="4" fill="rgba(255,42,95,0.2)"/>
    <text x="200" y="215" text-anchor="middle" fill="#ff2a5f" font-family="'Inter', sans-serif" font-size="10" font-weight="800">
      Si apagas de golpe, el aceite se calcina y rompe el turbo ($1.200 USD)
    </text>
  </g>

  <!-- Symptoms Bar Bottom -->
  <g transform="translate(60, 345)">
    <rect width="840" height="110" rx="10" fill="#0d1424" stroke="#1e293b"/>
    <text x="25" y="24" fill="#ffb703" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800">🚨 SÍNTOMAS DE ALERTA TEMPRANA DEL TURBO:</text>
    
    <text x="25" y="48" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700">🚓 Silbido como sirena de policía:</text>
    <text x="240" y="48" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Holgura en el eje flotante. Acudir a taller de inmediato.</text>

    <text x="25" y="70" fill="#38bdf8" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700">💨 Humo azulado o blanco espeso:</text>
    <text x="240" y="70" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Retenes gastados dejan pasar aceite a la cámara de combustión.</text>

    <text x="25" y="92" fill="#f59e0b" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700">🐌 Pérdida súbita de potencia:</text>
    <text x="240" y="92" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Manguera de intercooler rajada o válvula wastegate trabada.</text>
  </g>
</svg>