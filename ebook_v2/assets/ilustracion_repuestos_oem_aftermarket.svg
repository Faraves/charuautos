<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#10192a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="480" rx="16" fill="url(#bgRep)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="30" y="20" width="900" height="54" rx="8" fill="#131e33" stroke="rgba(0,242,254,0.3)"/>
  <text x="50" y="44" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">MÓDULO 13 • GUÍA ANTI-ESTAFAS DE TALLER</text>
  <text x="50" y="63" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="17" font-weight="900">PIRÁMIDE DE CALIDAD: OEM VS. OES (TIER 1) VS. GENÉRICO</text>
  <text x="890" y="52" text-anchor="end" fill="#ffb703" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700">💰 AHORRA HASTA 50%</text>

  <!-- 3 Quality Tiers Horizontal Cards -->
  <!-- Tier 1: OEM -->
  <g transform="translate(60, 95)">
    <rect width="840" height="95" rx="10" fill="#111c30" stroke="#00f2fe" stroke-width="1.5"/>
    <rect x="18" y="16" width="140" height="62" rx="6" fill="#172b47"/>
    <text x="88" y="42" text-anchor="middle" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="15" font-weight="900">OEM</text>
    <text x="88" y="60" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Original Equipment</text>
    
    <text x="180" y="38" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800">Pieza en caja oficial del fabricante del auto (Toyota, Ford, BMW, etc.)</text>
    <text x="180" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">• Máxima garantía y encaje milimétrico de fábrica.</text>
    <text x="180" y="74" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="11">• Inconveniente: Pagas un sobreprecio del 40% al 60% solo por la caja con logo.</text>
    <text x="810" y="52" text-anchor="end" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900">100% PRECIO</text>
  </g>

  <!-- Tier 2: OES / Tier 1 (THE SMART CHOICE) -->
  <g transform="translate(60, 205)">
    <rect width="840" height="105" rx="10" fill="#12242b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="18" y="18" width="140" height="68" rx="6" fill="#143b30"/>
    <text x="88" y="44" text-anchor="middle" fill="#10b981" font-family="'Montserrat', sans-serif" font-size="15" font-weight="900">OES / TIER 1</text>
    <text x="88" y="62" text-anchor="middle" fill="#38ef7d" font-family="'Inter', sans-serif" font-size="9" font-weight="700">★ LA COMPRA INTELIGENTE</text>
    
    <text x="180" y="38" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900">Fabricante real de la pieza: Bosch, Brembo, NGK, Mann, Valeo, Denso</text>
    <text x="180" y="58" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11">• ¡ES EXACTAMENTE LA MISMA PIEZA QUE VIENE EN LA CAJA OEM!</text>
    <text x="180" y="76" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="700">✓ Misma línea de montaje, mismos materiales y tolerancia, a mitad de precio.</text>
    <text x="810" y="56" text-anchor="end" fill="#10b981" font-family="'Montserrat', sans-serif" font-size="15" font-weight="900">-40% A -50%</text>
  </g>

  <!-- Tier 3: Genéricos / Marca Blanca -->
  <g transform="translate(60, 325)">
    <rect width="840" height="95" rx="10" fill="#1c1318" stroke="#ff2a5f" stroke-width="1.5"/>
    <rect x="18" y="16" width="140" height="62" rx="6" fill="#38151c"/>
    <text x="88" y="42" text-anchor="middle" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900">GENÉRICOS</text>
    <text x="88" y="60" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Marcas Blancas / Copias</text>
    
    <text x="180" y="38" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800">Piezas baratas sin certificación ni sello de calidad comprobable</text>
    <text x="180" y="58" fill="#ff2a5f" font-family="'Inter', sans-serif" font-size="11">• ⚠️ RIESGO CRÍTICO en pastillas de freno, bombas, sensores y dirección.</text>
    <text x="180" y="74" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">• Solo aceptable en piezas cosméticas como grapas, manillas plásticas o alfombras.</text>
    <text x="810" y="52" text-anchor="end" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900">MUY BARATO</text>
  </g>

  <!-- Footnote -->
  <text x="480" y="450" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">
    💡 <strong>Consejo CharuAutos:</strong> Pide siempre a tu taller que monte <strong style="fill:#10b981;">marcas OES Tier 1 reconocidas</strong>. Obtendrás la durabilidad de fábrica sin pagar el sobreprecio de marca.
  </text>
</svg>