<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFluids" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#10192a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="480" rx="16" fill="url(#bgFluids)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="30" y="20" width="900" height="54" rx="8" fill="#131e33" stroke="rgba(0,242,254,0.3)"/>
  <text x="50" y="44" fill="#00f2fe" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">MÓDULO 05 • FLUIDOS VITALES</text>
  <text x="50" y="63" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="17" font-weight="900">MAPA VISUAL DE DETECCIÓN DE FUGAS POR COLOR DE CHARCO</text>
  <text x="890" y="52" text-anchor="end" fill="#ffb703" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700">🔍 DIAGNÓSTICO EN EL PISO</text>

  <!-- 5 Droplet Cards Row -->
  <!-- Drop 1: Agua A/C -->
  <g transform="translate(45, 95)">
    <rect width="165" height="320" rx="10" fill="#111c30" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="82" cy="45" r="24" fill="rgba(16,185,129,0.15)" stroke="#10b981"/>
    <text x="82" y="53" text-anchor="middle" font-size="22">💧</text>
    <text x="82" y="88" text-anchor="middle" fill="#10b981" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800">AGUA CLARA</text>
    <text x="82" y="104" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Acuosa, inodora</text>
    <line x1="15" y1="116" x2="150" y2="116" stroke="#1e293b"/>
    <text x="15" y="136" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">ORIGEN:</text>
    <text x="15" y="152" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10">Condensación del Aire Acondicionado.</text>
    <rect x="10" y="240" width="145" height="60" rx="6" fill="#122722"/>
    <text x="82" y="260" text-anchor="middle" fill="#10b981" font-family="'Montserrat', sans-serif" font-size="10" font-weight="900">🟢 NORMAL</text>
    <text x="82" y="280" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">No es una fuga.</text>
    <text x="82" y="293" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">Puedes circular.</text>
  </g>

  <!-- Drop 2: Aceite Motor -->
  <g transform="translate(225, 95)">
    <rect width="165" height="320" rx="10" fill="#111c30" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="82" cy="45" r="24" fill="rgba(245,158,11,0.15)" stroke="#f59e0b"/>
    <text x="82" y="53" text-anchor="middle" font-size="22">🛢️</text>
    <text x="82" y="88" text-anchor="middle" fill="#f59e0b" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800">MARRÓN / NEGRO</text>
    <text x="82" y="104" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Oleosa, resbalosa</text>
    <line x1="15" y1="116" x2="150" y2="116" stroke="#1e293b"/>
    <text x="15" y="136" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">ORIGEN:</text>
    <text x="15" y="152" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10">Aceite de Motor (Cárter, retén o filtro).</text>
    <rect x="10" y="240" width="145" height="60" rx="6" fill="#2d2212"/>
    <text x="82" y="260" text-anchor="middle" fill="#f59e0b" font-family="'Montserrat', sans-serif" font-size="10" font-weight="900">🟡 MODERADO</text>
    <text x="82" y="280" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">Revisar varilla.</text>
    <text x="82" y="293" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">Añadir si falta.</text>
  </g>

  <!-- Drop 3: Refrigerante -->
  <g transform="translate(405, 95)">
    <rect width="165" height="320" rx="10" fill="#111c30" stroke="#ff2a5f" stroke-width="1.5"/>
    <circle cx="82" cy="45" r="24" fill="rgba(255,42,95,0.15)" stroke="#ff2a5f"/>
    <text x="82" y="53" text-anchor="middle" font-size="22">🌸</text>
    <text x="82" y="88" text-anchor="middle" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800">ROSA / VERDE NEÓN</text>
    <text x="82" y="104" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Acuosa, olor dulce</text>
    <line x1="15" y1="116" x2="150" y2="116" stroke="#1e293b"/>
    <text x="15" y="136" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">ORIGEN:</text>
    <text x="15" y="152" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10">Líquido Refrigerante (Radiador/Manguera).</text>
    <rect x="10" y="240" width="145" height="60" rx="6" fill="#2d1219"/>
    <text x="82" y="260" text-anchor="middle" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="10" font-weight="900">🔴 ALTO</text>
    <text x="82" y="280" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">Sobrecalentamiento.</text>
    <text x="82" y="293" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">¡No abrir en caliente!</text>
  </g>

  <!-- Drop 4: Fluido Transmisión ATF -->
  <g transform="translate(585, 95)">
    <rect width="165" height="320" rx="10" fill="#111c30" stroke="#ff2a5f" stroke-width="1.5"/>
    <circle cx="82" cy="45" r="24" fill="rgba(255,42,95,0.15)" stroke="#ff2a5f"/>
    <text x="82" y="53" text-anchor="middle" font-size="22">🍷</text>
    <text x="82" y="88" text-anchor="middle" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800">ROJO GROSELLA</text>
    <text x="82" y="104" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Aceite fluido brillante</text>
    <line x1="15" y1="116" x2="150" y2="116" stroke="#1e293b"/>
    <text x="15" y="136" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">ORIGEN:</text>
    <text x="15" y="152" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10">Caja Automática (ATF) o Dirección.</text>
    <rect x="10" y="240" width="145" height="60" rx="6" fill="#2d1219"/>
    <text x="82" y="260" text-anchor="middle" fill="#ff2a5f" font-family="'Montserrat', sans-serif" font-size="10" font-weight="900">🔴 ALTO</text>
    <text x="82" y="280" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">Riesgo en la caja.</text>
    <text x="82" y="293" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">Ir al taller pronto.</text>
  </g>

  <!-- Drop 5: Líquido Frenos -->
  <g transform="translate(765, 95)">
    <rect width="165" height="320" rx="10" fill="#111c30" stroke="#ef4444" stroke-width="2"/>
    <circle cx="82" cy="45" r="24" fill="rgba(239,68,68,0.25)" stroke="#ef4444"/>
    <text x="82" y="53" text-anchor="middle" font-size="22">🛑</text>
    <text x="82" y="88" text-anchor="middle" fill="#ef4444" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900">ÁMBAR / CLARO</text>
    <text x="82" y="104" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Tacto muy resbaloso</text>
    <line x1="15" y1="116" x2="150" y2="116" stroke="#1e293b"/>
    <text x="15" y="136" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">ORIGEN:</text>
    <text x="15" y="152" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10">Circuito de Frenos (Bomba o latiguillo).</text>
    <rect x="10" y="240" width="145" height="60" rx="6" fill="#3b1115"/>
    <text x="82" y="260" text-anchor="middle" fill="#ef4444" font-family="'Montserrat', sans-serif" font-size="10" font-weight="900">⛔ CRÍTICO</text>
    <text x="82" y="280" text-anchor="middle" fill="#fff" font-family="'Inter', sans-serif" font-size="9" font-weight="bold">¡NO CONDUCIR!</text>
    <text x="82" y="293" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">Pide una grúa.</text>
  </g>

  <!-- Footnote -->
  <text x="480" y="445" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">
    💡 <strong>Truco práctico:</strong> Coloca un cartón blanco limpio bajo el motor al estacionar por la noche. Por la mañana sabrás el color exacto sin mancharte.
  </text>
</svg>